name: CPU verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_DISABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU dependencies
        run: python -m pip install -r requirements-cpu.txt
      - name: Verify release payload
        run: |
          python tools/verify_manifest.py
          python tools/check_public_release.py --history
          python tools/paper_run_scope.py
          python tools/verify_aggregate_tables.py
          python tools/verify_manuscript_results.py
      - name: Run synthetic tests
        run: python -m pytest -q tests
